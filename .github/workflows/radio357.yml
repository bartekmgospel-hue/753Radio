name: Radio 357 -> Spotify

on:
  workflow_dispatch: {}
     
concurrency:
  group: 753radio-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Radio 357 playlist
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

          PLAYLIST_NAME: "753Radio"
          MAX_TRACKS: "5000"

          # Podczas zapełniania playlisty cofamy archiwum o 1 dzień na run.
          BACKFILL_DAYS_PER_RUN: "1"

          # Skrypt kończy się sam po 25 min, zamiast dać GitHubowi go anulować.
          MAX_RUNTIME_SECONDS: "1500"

          # Przy bardzo długim Retry-After kończymy run i próbujemy później.
          MAX_RETRY_AFTER: "90"

          # Przy LIVE ponownie sprawdzamy ostatnie 90 min.
          LIVE_OVERLAP_MINUTES: "90"

        run: python -u sync_radio357.py
